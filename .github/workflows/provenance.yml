name: provenance

# The repo had no CI at all: PROVENANCE.md documented a rigorous standard that
# nothing enforced, and viz/audit_provenance.py printed 17 gaps while exiting 0.
# This job makes the standard executable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PINNED. Byte-identical SVG reproduction is the repo's standard, and
      # matplotlib does not guarantee that across versions: this job first ran
      # unpinned, pulled 3.11.1 against figures rendered with 3.9.4, and failed
      # `make check` on ~5,400 SVG lines while every derived CSV was identical.
      - name: Install pinned figure toolchain
        run: python -m pip install --upgrade pip -r requirements-viz.txt

      # The campaign validator deliberately fails closed when its artifact
      # scanner is unavailable. Install the same pinned scanner used locally;
      # the separate Secret scan workflow still scans full Git history.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Run the same aggregate target used locally so Task 7's adversarial,
      # runner, validator, and publication tests cannot diverge from remote CI.
      - name: Full repository CI
        run: make ci
