name: provenance

# The repo had no CI at all: PROVENANCE.md documented a rigorous standard that
# nothing enforced, and viz/audit_provenance.py printed 17 gaps while exiting 0.
# This job makes the standard executable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install figure dependencies
        run: python -m pip install --upgrade pip matplotlib numpy

      # Figures are plots-as-code: a clean checkout must reproduce the committed
      # SVGs byte-identically. This already passed locally; now it is enforced.
      - name: Figures reproduce from committed artifacts
        run: make check

      # Ratcheted. The 17 known gaps are accepted in
      # viz/data/provenance_baseline.json; a NEW gap fails the build.
      - name: No new provenance gaps
        run: make check-artifacts

      # ISSUES #15: items where the model returned no content are scored 0 and
      # silently depress a published average.
      #
      # WARN-ONLY ON PURPOSE: three committed Lightning tasks are already over
      # the 2% threshold (GPQA 41.4%, GPQA-32k 20.7%, IFEval 8.7%). Failing here
      # today would just wedge CI red on known, documented debt. Change this to
      # `make samples` once those runs are re-served -- that flip is the
      # definition of done for the ISSUES #15 backlog.
      - name: Silent scoring failures (warn-only until re-serve backlog clears)
        run: python3 viz/validate_samples.py --warn-only
