# warpcore-v1 benchmark suite specification
#
# Single source of truth for all model-independent experiment variables.
# A serving adapter may not override any value defined here.
# Any change to a dataset, instance set, prompt, scoring rule, generation ceiling,
# harness behavior, or denominator creates a new suite version.
#
# Authoritative design:
#   docs/superpowers/specs/2026-09-15-warpcore-v1-apples-to-apples-design.md
#
# Dataset revisions are current local HuggingFace refs captured for v1 (prospective).
# They are pinned here for reproducibility; they are NOT claimed to match any
# prior historical run.

suite_id: "warpcore-v1"
suite_schema_version: 1

# ── Statistical reporting policy ────────────────────────────────────────────
statistical_policy:
  cross_model_comparison: "paired_per_item"
  binary_test: "exact_mcnemar_binomial"
  cross_model_requires_identical_item_sets: true
  non_significant_means: "insufficient_evidence_not_equality"
  interval_method: "wilson"
  reweighted_requires_uncertainty: true

# ── Benchmarks ───────────────────────────────────────────────────────────────
benchmarks:

  gsm8k:
    description: "GSM8K clean anchored-answer extraction (zero-shot CoT)"
    task_file: "suite/tasks/gsm8k_clean_v1.yaml"
    task_sha256: "b5ef6745a85d9e30369f48bd68bc7bf193b7b2d98e03db67c141f0dc995de6b8"
    dataset:
      path: "openai/gsm8k"
      name: "main"
      split: "test"
      revision: "740312add88f781978c0658806c59bc2815b9866"
    generation_ceiling: 8192
    sampling:
      temperature: 0
      do_sample: false
    num_fewshot: 0
    canonical_headline: "exact_match"
    expected_item_count: 1319
    # GSM8K canonical variant selection:
    #   Two retained variants: results/qwen3.6-35b-a3b/raw/gsm8k_cot_zeroshot_clean.yaml
    #   and results/nemotron-3.5-lightning-30b/raw/gsm8k_cot_zeroshot_clean.yaml.
    #   The qwen variant is canonical because:
    #   1. It contains metadata.version and metadata.fixed fields recording the fix history,
    #      while the nemotron variant is the older file without that provenance.
    #   2. The fix it records (2026-09-06: dataset_path gsm8k->openai/gsm8k; removed chained
    #      double-regex that truncated to first digit) is an evidence-based improvement.
    #   3. The qwen variant was the active task file for the successful Ornith clean-task run.
    #   4. The nemotron variant is otherwise byte-for-byte identical to the qwen variant
    #      minus only the metadata block, confirming it is the prior version.
    #
    # scoring_implementation: GSM8K scoring is implemented entirely within the pinned
    # task file (gsm8k_clean_v1.yaml, hash above). There is no separate utility file;
    # the answer extraction regex and exact-match logic live in the task YAML.
    required_evidence:
      - "aggregate_result"
      - "samples_jsonl_gz"
      - "per_item_csv"
      - "task_yaml"
      - "scoring_implementation"
      - "run_log"
      - "command_txt"
      - "manifest_json"
      - "status_json"
      - "done_sentinel"
      - "completion_token_counts"
      - "finish_reasons"
      - "full_response_fields"
    retry_policy:
      max_retries: 0
    timeout_policy:
      use_arithmetic: true
      safety_factor: 2

  ifeval:
    description: "IFEval standard task, prompt-level strict accuracy"
    task_file: "suite/tasks/ifeval_v4.yaml"
    task_sha256: "3d8a3eb32de03f6a23ac87b46951d972a4ec7cb137e753365c0271594e38f84b"
    dataset:
      # Exact dataset and revision pinned.  Task content separately pinned by
      # task_file/task_sha256 above (lm-eval 0.4.12 builtin ifeval.yaml).
      path: "google/IFEval"
      name: null
      split: "train"
      revision: "966cd89545d6b6acfd7638bc708b98261ca58e84"
    generation_ceiling: 65536
    sampling:
      temperature: 0
      do_sample: false
    num_fewshot: 0
    canonical_headline: "prompt_level_strict_acc"
    expected_item_count: 541
    # scoring_implementation: IFEval scoring utilities are embedded in the lm-eval harness
    # (pinned to revision lm_eval_revision in required_harness). There is no separate
    # external utility file; the instruction-following scorer runs within lm-eval.
    required_evidence:
      - "aggregate_result"
      - "samples_jsonl_gz"
      - "per_item_csv"
      - "task_yaml"
      - "scoring_implementation"
      - "run_log"
      - "command_txt"
      - "manifest_json"
      - "status_json"
      - "done_sentinel"
      - "completion_token_counts"
      - "finish_reasons"
      - "full_response_fields"
    retry_policy:
      max_retries: 0
    timeout_policy:
      use_arithmetic: true
      safety_factor: 2

  gpqa_diamond:
    description: "GPQA Diamond clean answer-line extraction (zero-shot CoT)"
    task_file: "suite/tasks/gpqa_diamond_clean_v3.yaml"
    task_sha256: "833259292b956a4bc620352c95ae43c30bb9d2b4049aebd3f67c4a1ec3b4267f"
    utils_file: "suite/tasks/gpqa_utils.py"
    utils_sha256: "7c755f2c3f8f4ac20de96fb68941c43424d2ded0552d5ab81e672e15c410655c"
    dataset:
      path: "Idavidrein/gpqa"
      name: "gpqa_diamond"
      split: "train"
      revision: "633f5ee89ab8ad4522a9f850766b73f62147ffdd"
    generation_ceiling: 65536
    sampling:
      temperature: 0
      do_sample: false
    num_fewshot: 0
    canonical_headline: "answer_line_exact_match"
    expected_item_count: 198
    # scoring_implementation: GPQA scoring is implemented in the pinned task file
    # (gpqa_diamond_clean_v3.yaml) plus the pinned utility module (gpqa_utils.py,
    # hash above). Both are required evidence; the utils_sha256 above pins them.
    required_evidence:
      - "aggregate_result"
      - "samples_jsonl_gz"
      - "per_item_csv"
      - "task_yaml"
      - "scoring_implementation"
      - "run_log"
      - "command_txt"
      - "manifest_json"
      - "status_json"
      - "done_sentinel"
      - "completion_token_counts"
      - "finish_reasons"
      - "full_response_fields"
    retry_policy:
      max_retries: 0
    timeout_policy:
      use_arithmetic: true
      safety_factor: 2

  swebench:
    description: "SWE-bench Verified, seed-42 n=100 instance set"
    dataset:
      # Canonical HuggingFace repository: princeton-nlp/SWE-bench_Verified.
      # Revision is a current local HF ref captured for v1 (prospective).
      path: "princeton-nlp/SWE-bench_Verified"
      revision: "c104f840cc67f8b6eec6f759ebc8b2693d585d4a"
    instance_set_file: "suite/swebench/instances-seed42-n100.json"
    instances_sha256: "d46f257dc87482e432307a6e96d5ee2d14b372df0c43b413eba48a573c6d0a24"
    scaffold_file: "suite/swebench/scaffold.yaml"
    scaffold_sha256: "f3de13ae23f684022c223e14071b7413f5d39d0b9bcb5c66b751670ebdcbba59"
    expected_item_count: 100
    canonical_headline: "resolved_div_all_100_assigned"
    # All 100 assigned instances remain in the denominator; disposition categories
    # explain misses but do not erase them.
    disposition_categories:
      - "resolved"
      - "submitted_but_wrong"
      - "model_non_submission"
      - "infrastructure_failure"
    cross_model_inference: "paired_mcnemar_binomial_on_identical_instance_ids"
    client_host: "mac_mini_x86"  # test containers are x86
    required_evidence:
      - "preds_json"
      - "exit_statuses"
      - "run_log"
      - "command_txt"
      - "manifest_json"
      - "status_json"
      - "done_sentinel"
    retry_policy:
      max_retries: 0
    timeout_policy:
      # Per-command timeout: 60 s (scaffold environment.timeout).
      # LLM request timeout: 1800 s (scaffold model.model_kwargs.timeout).
      # Docker pull timeout: 1800 s (scaffold environment.pull_timeout).
      # No automatic harness-level retries; operator manual re-run only.
      use_arithmetic: false
      command_timeout_s: 60
      llm_request_timeout_s: 1800
      pull_timeout_s: 1800

  throughput:
    description: "Warpcore short-context throughput sweep"
    host: "warpcore_on_box_client"
    endpoint: "openai_compatible_completions"
    workload:
      input_tokens: 512
      output_tokens: 256
    sampling:
      temperature: 0
    termination: "ignore_eos"
    concurrency_policy: "sweep_beyond_knee_to_plateau"
    report:
      - "output_tokens_per_second"
      - "ttft"
      - "tpot_itl"
      - "end_to_end_latency"
      - "success_count"
      - "concurrency"
    retry_policy:
      max_retries: 0
    timeout_policy:
      # vllm bench serve runs until the concurrency sweep reaches plateau naturally;
      # no client-level per-request timeout is imposed. Termination is determined
      # by the sweep logic, not a fixed numeric ceiling.
      use_arithmetic: false

# ── Suite-level policies ─────────────────────────────────────────────────────
required_harness:
  lm_eval_version: "0.4.12"
  lm_eval_revision: "6d642546f4688648fced259eb3302efd36ece5af"
  mini_swe_agent_version: "2.4.6"
  swebench_version: "4.1.0"

empty_response_classification:
  finish_length_empty: "BUDGET"      # raise max_gen_toks
  finish_stop_reasoning_populated: "PARSER"  # ISSUES #15
  finish_stop_nothing_anywhere: "EMPTY"

publication_rules:
  only_lifecycle_current: true
  no_cross_task_overall_rank: true
  missing_cells: "not_measured"
  no_imputation: true
  denominator_must_be_published: true
