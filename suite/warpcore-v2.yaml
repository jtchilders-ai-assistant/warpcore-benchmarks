# warpcore-v2 benchmark suite specification
#
# v2 is a clone of v1 with one change: SWE-bench launch authorization mode.
# v1 requires a 20-instance qualification seal before every n=100 launch.
# v2 replaces that with explicit direct_n100_after_preflight authorization:
# no separate qualification task sample; all production preflight gates must
# pass, and the same in-run circuit breaker applies.
#
# All other experiment-identity fields (dataset revision, instance set,
# scaffold, harness versions, statistical policy, generation ceilings,
# retry/timeout policies, circuit breaker) are IDENTICAL to v1, making
# results directly comparable under paired analysis.
#
# Authoritative design:
#   docs/superpowers/specs/2026-09-29-swebench-reporting-and-v2-launch-design.md
#
# Dataset revisions are the same local HuggingFace refs as v1.
# They are pinned for reproducibility and are NOT claimed to match any
# prior historical run.

suite_id: "warpcore-v2"
suite_schema_version: 2

# ── Statistical reporting policy ─────────────────────────────────────────────
# Identical to v1: v2 results are directly comparable under paired analysis.
statistical_policy:
  cross_model_comparison: "paired_per_item"
  binary_test: "exact_mcnemar_binomial"
  cross_model_requires_identical_item_sets: true
  non_significant_means: "insufficient_evidence_not_equality"
  interval_method: "wilson"
  reweighted_requires_uncertainty: true

# ── Benchmarks ────────────────────────────────────────────────────────────────
benchmarks:

  gsm8k:
    description: "GSM8K clean anchored-answer extraction (zero-shot CoT)"
    task_file: "suite/tasks/gsm8k_clean_v1.yaml"
    task_sha256: "b5ef6745a85d9e30369f48bd68bc7bf193b7b2d98e03db67c141f0dc995de6b8"
    dataset:
      path: "openai/gsm8k"
      name: "main"
      split: "test"
      revision: "740312add88f781978c0658806c59bc2815b9866"
    generation_ceiling: 8192
    sampling:
      temperature: 0
      do_sample: false
    num_fewshot: 0
    canonical_headline: "exact_match"
    expected_item_count: 1319
    required_evidence:
      - "aggregate_result"
      - "samples_jsonl_gz"
      - "per_item_csv"
      - "task_yaml"
      - "scoring_implementation"
      - "run_log"
      - "command_txt"
      - "manifest_json"
      - "status_json"
      - "done_sentinel"
      - "completion_token_counts"
      - "finish_reasons"
      - "full_response_fields"
    retry_policy:
      max_retries: 0
    timeout_policy:
      use_arithmetic: true
      safety_factor: 2

  ifeval:
    description: "IFEval standard task, prompt-level strict accuracy"
    task_file: "suite/tasks/ifeval_v4.yaml"
    task_sha256: "3d8a3eb32de03f6a23ac87b46951d972a4ec7cb137e753365c0271594e38f84b"
    dataset:
      path: "google/IFEval"
      name: null
      split: "train"
      revision: "966cd89545d6b6acfd7638bc708b98261ca58e84"
    generation_ceiling: 65536
    sampling:
      temperature: 0
      do_sample: false
    num_fewshot: 0
    canonical_headline: "prompt_level_strict_acc"
    expected_item_count: 541
    required_evidence:
      - "aggregate_result"
      - "samples_jsonl_gz"
      - "per_item_csv"
      - "task_yaml"
      - "scoring_implementation"
      - "run_log"
      - "command_txt"
      - "manifest_json"
      - "status_json"
      - "done_sentinel"
      - "completion_token_counts"
      - "finish_reasons"
      - "full_response_fields"
    retry_policy:
      max_retries: 0
    timeout_policy:
      use_arithmetic: true
      safety_factor: 2

  gpqa_diamond:
    description: "GPQA Diamond clean answer-line extraction (zero-shot CoT)"
    task_file: "suite/tasks/gpqa_diamond_clean_v3.yaml"
    task_sha256: "833259292b956a4bc620352c95ae43c30bb9d2b4049aebd3f67c4a1ec3b4267f"
    utils_file: "suite/tasks/gpqa_utils.py"
    utils_sha256: "7c755f2c3f8f4ac20de96fb68941c43424d2ded0552d5ab81e672e15c410655c"
    dataset:
      path: "Idavidrein/gpqa"
      name: "gpqa_diamond"
      split: "train"
      revision: "633f5ee89ab8ad4522a9f850766b73f62147ffdd"
    generation_ceiling: 65536
    sampling:
      temperature: 0
      do_sample: false
    num_fewshot: 0
    canonical_headline: "answer_line_exact_match"
    expected_item_count: 198
    required_evidence:
      - "aggregate_result"
      - "samples_jsonl_gz"
      - "per_item_csv"
      - "task_yaml"
      - "scoring_implementation"
      - "run_log"
      - "command_txt"
      - "manifest_json"
      - "status_json"
      - "done_sentinel"
      - "completion_token_counts"
      - "finish_reasons"
      - "full_response_fields"
    retry_policy:
      max_retries: 0
    timeout_policy:
      use_arithmetic: true
      safety_factor: 2

  swebench:
    description: "SWE-bench Verified, seed-42 n=100 instance set"
    dataset:
      # Canonical HuggingFace repository: princeton-nlp/SWE-bench_Verified.
      # Same revision as v1 for direct comparability.
      path: "princeton-nlp/SWE-bench_Verified"
      revision: "c104f840cc67f8b6eec6f759ebc8b2693d585d4a"
    instance_set_file: "suite/swebench/instances-seed42-n100.json"
    instances_sha256: "d46f257dc87482e432307a6e96d5ee2d14b372df0c43b413eba48a573c6d0a24"
    scaffold_file: "suite/swebench/scaffold.yaml"
    scaffold_sha256: "419244dc6060fc242ba4defb72c3098c351ed6b4325ac6742737a463ace6125f"
    expected_item_count: 100
    # ── Launch authorization (v2 change from v1) ──────────────────────────────
    # v1 uses qualification_seal (requires 20-instance qual record).
    # v2 uses direct_n100_after_preflight: no separate task sample, but ALL
    # production preflight gates must pass and the in-run circuit breaker
    # remains active. Unknown modes fail closed.
    launch_authorization:
      mode: "direct_n100_after_preflight"
    # NOTE: No 'qualification' block here — direct_n100_after_preflight mode
    # does not use and must not carry a qualification block.
    canonical_headline: "resolved_div_all_100_assigned"
    # All 100 assigned instances remain in the denominator; disposition categories
    # explain misses but do not erase them.
    disposition_categories:
      - "resolved"
      - "submitted_but_wrong"
      - "model_non_submission"
      - "infrastructure_failure"
    cross_model_inference: "paired_mcnemar_binomial_on_identical_instance_ids"
    client_host: "mac_mini_x86"  # test containers are x86
    required_evidence:
      - "preds_json"
      - "exit_statuses"
      - "run_log"
      - "command_txt"
      - "manifest_json"
      - "status_json"
      - "done_sentinel"
    retry_policy:
      max_retries: 0
    timeout_policy:
      # Per-command timeout: 60 s (scaffold environment.timeout).
      # LLM request timeout: 1800 s (scaffold model.model_kwargs.timeout).
      # Docker pull timeout: 1800 s (scaffold environment.pull_timeout).
      # No automatic harness-level retries; operator manual re-run only.
      use_arithmetic: false
      command_timeout_s: 60
      llm_request_timeout_s: 1800
      pull_timeout_s: 1800

  throughput:
    description: "Warpcore short-context throughput sweep"
    host: "warpcore_on_box_client"
    endpoint: "openai_compatible_completions"
    workload:
      input_tokens: 512
      output_tokens: 256
    sampling:
      temperature: 0
    termination: "ignore_eos"
    concurrency_policy: "sweep_beyond_knee_to_plateau"
    report:
      - "output_tokens_per_second"
      - "ttft"
      - "tpot_itl"
      - "end_to_end_latency"
      - "success_count"
      - "concurrency"
    retry_policy:
      max_retries: 0
    timeout_policy:
      use_arithmetic: false

# ── Suite-level policies ──────────────────────────────────────────────────────
# Identical to v1 for direct comparability.
required_harness:
  lm_eval_version: "0.4.12"
  lm_eval_revision: "6d642546f4688648fced259eb3302efd36ece5af"
  mini_swe_agent_version: "2.4.6"
  swebench_version: "4.1.0"

empty_response_classification:
  finish_length_empty: "BUDGET"      # raise max_gen_toks
  finish_stop_reasoning_populated: "PARSER"  # ISSUES #15
  finish_stop_nothing_anywhere: "EMPTY"

publication_rules:
  only_lifecycle_current: true
  no_cross_task_overall_rank: true
  missing_cells: "not_measured"
  no_imputation: true
  denominator_must_be_published: true
